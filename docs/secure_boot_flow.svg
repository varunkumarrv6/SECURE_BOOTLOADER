<rect x="850" y="140" width="370" height="56" rx="10" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="1.6"/>
<text x="866" y="164" font-size="15" font-weight="bold" fill="#0F4A41" text-anchor="start">Reset: bootloader runs on the CM7</text>
<text x="866" y="184" font-size="13" font-weight="normal" fill="#0F4A41" text-anchor="start">banner + chip UID over UART (115200 8N1)</text>
<path d="M1035.0,196 V226" fill="none" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#m_2E7D32)"/>
<text x="1045.0" y="215" font-size="11" font-weight="normal" fill="#1F2933" text-anchor="start"></text>
<rect x="850" y="226" width="370" height="70" rx="10" fill="#E3F3F0" stroke="#1F7A6D" stroke-width="1.6"/>
<text x="866" y="250" font-size="15" font-weight="bold" fill="#0F4A41" text-anchor="start">1   Sanity checks</text>
<text x="866" y="272" font-size="13" font-weight="normal" fill="#0F4A41" text-anchor="start">magic 0x46574D41, sizes inside regions</text>
<rect x="1245" y="226" width="225" height="70" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="1.6"/>
<text x="1259" y="250" font-size="14" font-weight="bold" fill="#8E1B1B" text-anchor="start">FAIL: magic / size</text>
<text x="1259" y="270" font-size="12.5" font-weight="normal" fill="#8E1B1B" text-anchor="start">stop, never jump</text>
<text x="1259" y="284" font-size="11.5" font-weight="normal" fill="#8E1B1B" text-anchor="start" font-style="italic">coded, not run on the board</text>
<path d="M1220,261.0 H1245" fill="none" stroke="#C62828" stroke-width="2.2" marker-end="url(#m_C62828)"/>
<path d="M1035.0,296 V326" fill="none" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#m_2E7D32)"/>
<rect x="850" y="326" width="370" height="112" rx="10" fill="#E3F3F0" stroke="#1F7A6D" stroke-width="1.6"/>
<text x="866" y="350" font-size="15" font-weight="bold" fill="#0F4A41" text-anchor="start">2   Authenticate the header</text>
<text x="866" y="372" font-size="13" font-weight="normal" fill="#0F4A41" text-anchor="start">hash the 128 B block (recomputed here)</text>
<text x="866" y="391" font-size="13" font-weight="normal" fill="#0F4A41" text-anchor="start">ECDSA verify with the public key</text>
<text x="1206" y="428" font-size="11.5" font-weight="normal" fill="#52606D" text-anchor="end" font-style="italic">reads 0x08020000</text>
<rect x="1245" y="326" width="225" height="112" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="1.6"/>
<text x="1259" y="350" font-size="14" font-weight="bold" fill="#8E1B1B" text-anchor="start">FAIL: signature</text>
<text x="1259" y="370" font-size="12.5" font-weight="normal" fill="#8E1B1B" text-anchor="start">stop, never jump</text>
<text x="1259" y="426" font-size="11.5" font-weight="normal" fill="#8E1B1B" text-anchor="start" font-style="italic">Test 3: 1 header byte flipped</text>
<path d="M1220,382.0 H1245" fill="none" stroke="#C62828" stroke-width="2.2" marker-end="url(#m_C62828)"/>
<path d="M1035.0,438 V468" fill="none" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#m_2E7D32)"/>
<rect x="850" y="468" width="370" height="84" rx="10" fill="#E3F3F0" stroke="#1F7A6D" stroke-width="1.6"/>
<text x="866" y="492" font-size="15" font-weight="bold" fill="#0F4A41" text-anchor="start">3   Is the CM7 image intact?</text>
<text x="866" y="514" font-size="13" font-weight="normal" fill="#0F4A41" text-anchor="start">SHA-256 of CM7 @ 0x08020400</text>
<text x="866" y="533" font-size="13" font-weight="normal" fill="#0F4A41" text-anchor="start">equals the signed CM7 digest ?</text>
<rect x="1245" y="468" width="225" height="84" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="1.6"/>
<text x="1259" y="492" font-size="14" font-weight="bold" fill="#8E1B1B" text-anchor="start">FAIL: CM7 digest</text>
<text x="1259" y="512" font-size="12.5" font-weight="normal" fill="#8E1B1B" text-anchor="start">stop, never jump</text>
<text x="1259" y="540" font-size="11.5" font-weight="normal" fill="#8E1B1B" text-anchor="start" font-style="italic">Test 2: 1 CM7 byte flipped</text>
<path d="M1220,510.0 H1245" fill="none" stroke="#C62828" stroke-width="2.2" marker-end="url(#m_C62828)"/>
<path d="M1035.0,552 V582" fill="none" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#m_2E7D32)"/>
<rect x="850" y="582" width="370" height="84" rx="10" fill="#E3F3F0" stroke="#1F7A6D" stroke-width="1.6"/>
<text x="866" y="606" font-size="15" font-weight="bold" fill="#0F4A41" text-anchor="start">4   Is the CM4 image intact?</text>
<text x="866" y="628" font-size="13" font-weight="normal" fill="#0F4A41" text-anchor="start">SHA-256 of CM4 @ 0x08100000</text>
<text x="866" y="647" font-size="13" font-weight="normal" fill="#0F4A41" text-anchor="start">equals the signed CM4 digest ?</text>
<rect x="1245" y="582" width="225" height="84" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="1.6"/>
<text x="1259" y="606" font-size="14" font-weight="bold" fill="#8E1B1B" text-anchor="start">FAIL: CM4 digest</text>
<text x="1259" y="626" font-size="12.5" font-weight="normal" fill="#8E1B1B" text-anchor="start">stop, never jump</text>
<text x="1259" y="654" font-size="11.5" font-weight="normal" fill="#8E1B1B" text-anchor="start" font-style="italic">Test 4: 1 CM4 byte flipped</text>
<path d="M1220,624.0 H1245" fill="none" stroke="#C62828" stroke-width="2.2" marker-end="url(#m_C62828)"/>
<path d="M1035.0,666 V696" fill="none" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#m_2E7D32)"/>
<rect x="850" y="696" width="370" height="100" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2"/>
<text x="866" y="720" font-size="15" font-weight="bold" fill="#14451A" text-anchor="start">5   All checks passed</text>
<text x="866" y="742" font-size="13" font-weight="normal" fill="#14451A" text-anchor="start">SECURE BOOT: image verified</text>
<text x="866" y="761" font-size="13" font-weight="normal" fill="#14451A" text-anchor="start">check SP / reset, clean up, jump to CM7 app</text>
<rect x="1245" y="696" width="225" height="100" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1.6"/>
<text x="1259" y="720" font-size="14" font-weight="bold" fill="#14451A" text-anchor="start">Application starts</text>
<text x="1259" y="740" font-size="12.5" font-weight="normal" fill="#14451A" text-anchor="start">CM7 app @ 0x08020400</text>
<text x="1259" y="784" font-size="11.5" font-weight="normal" fill="#14451A" text-anchor="start" font-style="italic">Test 1: valid image boots</text>
<path d="M1220,746 H1245" fill="none" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#m_2E7D32)"/>
<text x="850" y="826" font-size="13" font-weight="normal" fill="#8E1B1B" text-anchor="start">Any failure: print the reason on the serial port and halt in the bootloader.</text>
<text x="850" y="846" font-size="13" font-weight="normal" fill="#8E1B1B" text-anchor="start">Nothing past the failed check is trusted or started.</text>
<text x="1045.0" y="216" font-size="11" font-weight="normal" fill="#2E7D32" text-anchor="start">pass</text>
<rect x="30" y="868" width="1440" height="52" rx="8" fill="#F7F8FA" stroke="#D5DAE0" stroke-width="1"/>
<rect x="50" y="884" width="18" height="18" rx="4" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="76" y="898" font-size="12.5" font-weight="normal" fill="#323F4B" text-anchor="start">PC / build time</text>
<rect x="210" y="884" width="18" height="18" rx="4" fill="#F3F1EA" stroke="#8A8575" stroke-width="1.6"/>
<text x="236" y="898" font-size="12.5" font-weight="normal" fill="#323F4B" text-anchor="start">Flash content</text>
<rect x="360" y="884" width="18" height="18" rx="4" fill="#E3F3F0" stroke="#1F7A6D" stroke-width="1.6"/>
<text x="386" y="898" font-size="12.5" font-weight="normal" fill="#323F4B" text-anchor="start">Bootloader check</text>
<rect x="540" y="884" width="18" height="18" rx="4" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1.6"/>
<text x="566" y="898" font-size="12.5" font-weight="normal" fill="#323F4B" text-anchor="start">Pass</text>
<rect x="620" y="884" width="18" height="18" rx="4" fill="#FDECEA" stroke="#C62828" stroke-width="1.6"/>
<text x="646" y="898" font-size="12.5" font-weight="normal" fill="#323F4B" text-anchor="start">Refused</text>
<rect x="720" y="884" width="18" height="18" rx="4" fill="#F3E8FD" stroke="#7B3FA0" stroke-width="1.6"/>
<text x="746" y="898" font-size="12.5" font-weight="normal" fill="#323F4B" text-anchor="start">Key material</text>
<text x="1450" y="898" font-size="12.5" font-weight="bold" fill="#323F4B" text-anchor="end">Private key signs only on the PC. The public key in the bootloader can only verify.</text>
